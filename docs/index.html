<!DOCTYPE html>
<html>
<head>
    <title>Max's Match 3</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #5a3a33;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/icon-32.png?v=31">
    <link rel="icon" type="image/svg+xml" sizes="any" href="assets/images/icon.svg?v=31">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#5a3a33">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/icon-180.png?v=31">
</head>
<body>

<script type="module" src="assets/js/game.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW registered', reg))
                .catch(err => console.log('SW failed', err));
        });
    }
</script>

</body>
</html>
